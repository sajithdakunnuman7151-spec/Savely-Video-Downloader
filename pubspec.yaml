name: savely
description: "A high-quality production Android video downloader."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

    
  cupertino_icons: ^1.0.2
  
  # අපි පාවිච්චි කරන අනිත් Packages
  flutter_riverpod: ^2.4.3
  dio: ^5.3.3
  flutter_downloader: ^1.11.1
  google_mobile_ads: ^5.1.0
  shared_preferences: ^2.2.2
  youtube_explode_dart: ^2.1.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true